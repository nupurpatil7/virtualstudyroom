<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head><body onload="displayAdmin()"><header><h2>Virtual Study Room - Admin</h2><nav><a href="index.html">Home</a><a href="resources.html">Resources</a><a href="#" onclick="logout()">Logout</a></nav></header><div class="container"><h1>Admin Dashboard</h1><div class="grid"><div class="card"><h3>Registered Students</h3><h2 id="userCount">0</h2></div><div class="card"><h3>Study Rooms</h3><h2 id="roomCount">0</h2></div><div class="card"><h3>Study Resources</h3><h2 id="resourceCount">0</h2></div></div><div class="panel"><h2>Add Learning Resource</h2><form onsubmit="addResource(event)"><label>Resource Title</label><input id="resourceTitle" required><label>Category</label><select id="resourceCategory"><option>Programming</option><option>Mathematics</option><option>Web Design</option><option>Other</option></select><label>Description</label><textarea id="resourceDescription" required></textarea><button type="submit">Add Resource</button></form></div><div class="panel"><h2>Study Room Overview</h2><div id="adminRooms"></div></div><div class="panel"><h2>Recent Activity / Notifications</h2><div id="notifications"></div></div></div><footer>Virtual Study Room Platform</footer></body></html>
